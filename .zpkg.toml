[package]
org = "hacker-house-medellin"
name = "hhm-cli"
version = "0.1.0"
description = "Command-line interface for Hacker House Medellín"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/hacker-house-medellin/hhm-cli"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/hhm-cli\" && \"$ZED_PKG_TEST_TARGET/target/release/hhm-cli\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "node_modules/**", ".vendor/.zed/**", "target/**", "tmp/**", "dist/**", "*.log", ".DS_Store"]

[dependencies]
"hacker-house-medellin/hhm-clients" = "^0.1.0"
"hacker-house-medellin/hhm-interfaces" = "^0.1.0"
"hacker-house-medellin/hhm-libs" = "^0.1.0"

[install]
dir = ".vendor/.zed"
adapter = "none"

[build]
command = "cargo build --release --locked --bin hhm-cli"
outputs = ["target/release/hhm-cli"]

[bin]
hhm-cli = "target/release/hhm-cli"

[scripts]
test = "cargo test --all-targets --locked"
