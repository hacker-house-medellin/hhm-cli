[package]
name = "hhm-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "flags-2-env operator CLI for Hacker House Medellín health, reservation operations, and WebSocket watching."
repository = "https://github.com/hacker-house-medellin/hhm-cli"
publish = false

[dependencies]
anyhow = "1"
flags2env = { git = "https://github.com/ORESoftware/flags-2-env", rev = "b596f2d1c99bd726b262a923916e3015bc80bc37", package = "flags2env" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# --- functional programming conformance -------------------------------------
# Warn level only: these never fail a build. They fail `cargo clippy -- -D warnings`
# in the nightly job. See FP-GUIDELINES.md for the principle behind each group.

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
# typed errors: panicking is not error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
# illegal states excluded by types
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# immutable values and pure transformations
mut_mut = "warn"
needless_pass_by_ref_mut = "warn"
# composition
too_many_lines = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
# explicit inputs and outputs
must_use_candidate = "warn"
return_self_not_must_use = "warn"
