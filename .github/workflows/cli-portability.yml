name: CLI portability

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - '.cli-flags.toml'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/cli-portability.yml'
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - '.cli-flags.toml'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/cli-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-portability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: Rust CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out the exact caller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run all tests
        run: cargo test --locked --all-targets
      - name: Build release CLI
        run: cargo build --locked --release --bins
      - name: Smoke CLI help
        run: cargo run --locked --release -- --help
