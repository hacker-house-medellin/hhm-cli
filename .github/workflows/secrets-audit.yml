name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
#
# Runs with NO age key on purpose. Everything it asserts is key-independent:
# that no plaintext env file is tracked or staged, that .gitignore still denies
# them, that nothing was force-added past those rules, and that every file in
# env/enc/ is genuinely sops-encrypted with at least two recipients. Handing CI
# a decryption key merely to lint would defeat the audit it is performing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0

      - name: Install just
        env:
          JUST_VERSION: 1.51.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Keyless read-only audit and symlink regression
        shell: bash
        run: |
          set -euo pipefail
          # The audit is deliberately independent of ores-sops and any age key.
          if command -v ores-sops >/dev/null 2>&1; then
            echo "unexpected ores-sops installation on keyless audit runner" >&2
            exit 1
          fi
          if [[ -e env/dec || -L env/dec ]]; then
            echo "fresh checkout unexpectedly contains env/dec" >&2
            exit 1
          fi
          just env-check
          if [[ -e env/dec || -L env/dec ]]; then
            echo "read-only audit created env/dec" >&2
            exit 1
          fi

          # The shared module used to reject this symlink in _env-dec.
          # Keep the denial even though env-check no longer creates directories.
          ln -s "$RUNNER_TEMP" env/dec
          trap 'if [[ -L env/dec ]]; then unlink env/dec; fi' EXIT
          if just env-check; then
            echo "audit incorrectly accepted an env/dec symlink" >&2
            exit 1
          fi
          unlink env/dec
          trap - EXIT
          just env-check
