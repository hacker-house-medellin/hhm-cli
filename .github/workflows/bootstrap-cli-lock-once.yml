name: Bootstrap CLI lockfile once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'src/**'
      - '.github/workflows/bootstrap-cli-lock-once.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-cli-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-3020-cli-portability'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3020-cli-portability
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Generate and validate the committed lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture
          cargo build --locked --release --bins
          git diff --check

      - name: Commit only the reproducibility changes
        run: |
          set -euo pipefail
          carrier='.github/workflows/bootstrap-cli-lock-once.yml'
          rm "$carrier"
          git diff --check

          unexpected="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | grep -Ev '^(Cargo.lock|src/.*\.rs|\.github/workflows/bootstrap-cli-lock-once\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected generated paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- Cargo.lock src "$carrier"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'ci(DEN-3020): lock and format the cross-platform CLI'
          git push origin HEAD:agent/den-3020-cli-portability
