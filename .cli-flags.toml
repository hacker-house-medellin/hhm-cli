[help]
url = "https://github.com/hacker-house-medellin/hhm-cli"
columns = ["options", "env", "type", "default", "description"]

[parse]
command_env = "HHM_COMMAND"
errors_env = "HHM_PARSE_ERRORS"
unknown_options_env = "HHM_UNKNOWN_OPTIONS"

[env]
ignore = ["HHM_TOKEN", "SUPABASE_SERVICE_ROLE_KEY"]

[flags.base_url]
env = "HHM_BASE_URL"
aliases = ["base-url"]
type = "string"
default = "http://127.0.0.1:8080"
help = "Base URL for the Hacker House Medellín API."

[flags.timeout_seconds]
env = "HHM_TIMEOUT_SECONDS"
aliases = ["timeout-seconds"]
type = "integer"
default = 20
help = "HTTP timeout in seconds."

[flags.output]
env = "HHM_OUTPUT"
aliases = ["output"]
type = "string"
default = "json"
help = "Output mode: json or text."

[commands.health]
help = "Check API health."

[commands.list]
help = "List reservations."

[commands.get]
help = "Get one reservation."
[commands.get.flags.id]
env = "HHM_ID"
aliases = ["id"]
type = "string"
help = "Reservation UUID."

[commands.watch]
help = "Watch the API WebSocket operations stream."
